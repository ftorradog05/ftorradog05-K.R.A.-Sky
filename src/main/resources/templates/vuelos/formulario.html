<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>KRAsky | Editor Vuelo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* (Copia aquí el bloque <style> del archivo lista.html anterior) */
    :root { --sidebar-bg: #1e293b; --sidebar-width: 260px; --header-height: 60px; }
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; font-size: 0.875rem; }
    .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background-color: var(--sidebar-bg); color: #94a3b8; display: flex; flex-direction: column; z-index: 1000; }
    .main-content { margin-left: var(--sidebar-width); padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card-form { background: white; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; max-width: 800px; }
    .form-label { font-weight: 600; color: #334155; font-size: 0.8rem; }
    .form-control, .form-select { border-color: #cbd5e1; padding: 0.6rem 1rem; }
    .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
    .btn-primary-corp { background-color: #0f172a; color: white; padding: 0.75rem 2rem; border: none; }
  </style>
</head>
<body>
<div class="main-content bg-light">
  <div class="card card-form">
    <div class="card-header bg-white border-bottom p-4">
      <h5 class="mb-0 fw-bold text-dark">Detalles del Vuelo</h5>
    </div>
    <div class="card-body p-4">
      <form th:action="@{/web/vuelos/guardar}" th:object="${vuelo}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label">Número de Vuelo</label>
            <input type="text" class="form-control" th:field="*{numeroVuelo}" placeholder="Ej: IB3400" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Avión Asignado</label>
            <select class="form-select" th:field="*{avionId}" required>
              <option value="" disabled selected>Seleccionar aeronave...</option>
              <option th:each="a : ${listaAviones}" th:value="${a.id}" th:text="${a.modelo} + ' (' + ${a.matricula} + ')'"></option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Origen</label>
            <input type="text" class="form-control" th:field="*{origen}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Destino</label>
            <input type="text" class="form-control" th:field="*{destino}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha Salida</label>
            <input type="datetime-local" class="form-control" th:field="*{fechaSalida}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha Llegada</label>
            <input type="datetime-local" class="form-control" th:field="*{fechaLlegada}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Precio Turista</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precioTurista}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Precio Business</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precioBusiness}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Estado</label>
            <select class="form-select" th:field="*{estado}">
              <option value="PROGRAMADO">PROGRAMADO</option>
              <option value="EN_VUELO">EN VUELO</option>
              <option value="FINALIZADO">FINALIZADO</option>
              <option value="CANCELADO">CANCELADO</option>
            </select>
          </div>
        </div>
        <div class="d-flex justify-content-between mt-5 pt-3 border-top">
          <a href="/web/vuelos" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary-corp">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>

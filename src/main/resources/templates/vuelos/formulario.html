<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KRAsky | Editor Vuelo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --header-height: 60px; }
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; font-size: 0.875rem; }

        /* Ajustado: margin: 0 para que ocupe el centro sin dejar hueco a la izquierda */
        .main-content { margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .card-form { background: white; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; max-width: 800px; }
        .form-label { font-weight: 600; color: #334155; font-size: 0.8rem; }
        .btn-primary-corp { background-color: #0f172a; color: white; padding: 0.75rem 2rem; border: none; }

        /* CLASE EXTRA PARA ERRORES */
        .is-invalid { border-color: #dc3545 !important; }
        .invalid-feedback { display: block; font-size: 0.75rem; color: #dc3545; margin-top: 0.25rem; }
    </style>
</head>
<body>

<div class="main-content bg-light">
    <div class="card card-form">
        <div class="card-header bg-white border-bottom p-4">
            <h5 class="mb-0 fw-bold text-dark">Detalles del Vuelo</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/web/vuelos/guardar}" th:object="${vuelo}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label">Número de Vuelo</label>
                        <input type="text" class="form-control" th:field="*{numeroVuelo}"
                               th:classappend="${#fields.hasErrors('numeroVuelo')} ? 'is-invalid' : ''">
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('numeroVuelo')}" th:errors="*{numeroVuelo}"></span>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Avión Asignado</label>
                        <select class="form-select" th:field="*{avionId}"
                                th:classappend="${#fields.hasErrors('avionId')} ? 'is-invalid' : ''">
                            <option th:each="a : ${listaAviones}" th:value="${a.id}" th:text="${a.modelo} + ' (' + ${a.matricula} + ')'"></option>
                        </select>
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('avionId')}" th:errors="*{avionId}"></span>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Origen</label>
                        <input type="text" class="form-control" th:field="*{origen}"
                               th:classappend="${#fields.hasErrors('origen')} ? 'is-invalid' : ''">
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('origen')}" th:errors="*{origen}"></span>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Destino</label>
                        <input type="text" class="form-control" th:field="*{destino}"
                               th:classappend="${#fields.hasErrors('destino')} ? 'is-invalid' : ''">
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('destino')}" th:errors="*{destino}"></span>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Salida</label>
                        <input type="datetime-local" class="form-control" th:field="*{fechaSalida}"
                               th:classappend="${#fields.hasErrors('fechaSalida')} ? 'is-invalid' : ''">
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('fechaSalida')}" th:errors="*{fechaSalida}"></span>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Llegada</label>
                        <input type="datetime-local" class="form-control" th:field="*{fechaLlegada}"
                               th:classappend="${#fields.hasErrors('fechaLlegada')} ? 'is-invalid' : ''">
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('fechaLlegada')}" th:errors="*{fechaLlegada}"></span>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Precio Turista</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{precioTurista}"
                               th:classappend="${#fields.hasErrors('precioTurista')} ? 'is-invalid' : ''">
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('precioTurista')}" th:errors="*{precioTurista}"></span>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Precio Business</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{precioBusiness}"
                               th:classappend="${#fields.hasErrors('precioBusiness')} ? 'is-invalid' : ''">
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('precioBusiness')}" th:errors="*{precioBusiness}"></span>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select class="form-select" th:field="*{estado}">
                            <option value="PROGRAMADO">PROGRAMADO</option>
                            <option value="EN_VUELO">EN VUELO</option>
                            <option value="FINALIZADO">FINALIZADO</option>
                            <option value="CANCELADO">CANCELADO</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-5 pt-3 border-top">
                    <a href="/web/vuelos" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary-corp">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

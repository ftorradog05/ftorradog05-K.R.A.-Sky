<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>KRAsky - Vuelos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-plane me-2"></i>Vuelos KRAsky</h2>
    <div>
      <a href="/" class="btn btn-secondary me-2">Volver</a>
      <a href="/web/vuelos/nuevo" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Vuelo</a>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
          <tr>
            <th>Vuelo</th>
            <th>Origen</th>
            <th>Destino</th>
            <th>Salida</th>
            <th>Precio (T/B)</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="v : ${listaVuelos}">
            <td th:text="${v.numeroVuelo}" class="fw-bold"></td>
            <td th:text="${v.origen}"></td>
            <td th:text="${v.destino}"></td>
            <td th:text="${#temporals.format(v.fechaSalida, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <span th:text="${v.precioTurista} + '€'"></span> /
              <span th:text="${v.precioBusiness} + '€'"></span>
            </td>
            <td>
                            <span th:text="${v.estado}"
                                  th:class="${v.estado == 'PROGRAMADO'} ? 'badge bg-primary' :
                                           (${v.estado == 'CANCELADO'} ? 'badge bg-danger' :
                                           (${v.estado == 'FINALIZADO'} ? 'badge bg-secondary' : 'badge bg-success'))">
                            </span>
            </td>
            <td>
              <a th:href="@{/web/vuelos/editar/{id}(id=${v.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
              <a th:href="@{/web/vuelos/eliminar/{id}(id=${v.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que quieres eliminar este vuelo?');"><i class="fas fa-trash"></i></a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>

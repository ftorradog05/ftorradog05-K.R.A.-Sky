<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>KRAsky - Pasajero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow col-md-8 mx-auto">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0">Datos del Pasajero</h4>
    </div>
    <div class="card-body">
      <form th:action="@{/web/pasajeros/guardar}" th:object="${pasajero}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required />
          </div>
          <div class="col-md-6 mb-3">
            <label>Apellidos</label>
            <input type="text" class="form-control" th:field="*{apellidos}" required />
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>DNI</label>
            <input type="text" class="form-control" th:field="*{dni}" required />
          </div>
          <div class="col-md-6 mb-3">
            <label>Fecha Nacimiento</label>
            <input type="date" class="form-control" th:field="*{fechaNacimiento}" required />
          </div>
        </div>
        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" th:field="*{email}" required />
        </div>
        <div class="mb-3">
          <label>Teléfono</label>
          <input type="text" class="form-control" th:field="*{telefono}" />
        </div>
        <button type="submit" class="btn btn-success w-100">Guardar</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>

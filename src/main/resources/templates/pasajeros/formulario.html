<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>KRAsky | Editor Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    .main-content { padding: 2rem; display: flex; justify-content: center; min-height: 100vh; }
    .card-form { background: white; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
    .form-label { font-weight: 600; font-size: 0.8rem; }
    .btn-primary-corp { background-color: #0f172a; color: white; border: none; padding: 0.6rem 2rem; }
  </style>
</head>
<body>
<div class="main-content">
  <div class="card card-form">
    <div class="card-header bg-white border-bottom p-4">
      <h5 class="mb-0 fw-bold">Ficha de Pasajero</h5>
    </div>
    <div class="card-body p-4">
      <form th:action="@{/web/pasajeros/guardar}" th:object="${pasajero}" method="post">
        <input type="hidden" th:field="*{id}" />
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Apellidos</label>
            <input type="text" class="form-control" th:field="*{apellidos}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">DNI / Pasaporte</label>
            <input type="text" class="form-control" th:field="*{dni}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha Nacimiento</label>
            <input type="date" class="form-control" th:field="*{fechaNacimiento}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" th:field="*{telefono}">
          </div>
        </div>
        <div class="d-flex justify-content-between mt-5 pt-3 border-top">
          <a href="/web/pasajeros" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary-corp">Guardar Ficha</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KRAsky - Pasajeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-users me-2"></i>Pasajeros KRAsky</h2>
        <div>
            <a href="/" class="btn btn-secondary me-2">Volver</a>
            <a href="/web/pasajeros/nuevo" class="btn btn-success"><i class="fas fa-plus"></i> Nuevo Pasajero</a>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${listaPasajeros}">
                    <td th:text="${p.dni}" class="fw-bold"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.apellidos}"></td>
                    <td th:text="${p.email}"></td>
                    <td>
                        <a th:href="@{/web/pasajeros/editar/{id}(id=${p.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                        <a th:href="@{/web/pasajeros/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar pasajero?');"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

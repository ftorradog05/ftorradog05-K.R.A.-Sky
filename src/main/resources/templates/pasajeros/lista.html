<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KRAsky | Pasajeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-bg: #1e293b; --sidebar-width: 260px; --header-height: 60px; }
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; font-size: 0.875rem; }
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background-color: var(--sidebar-bg); color: #94a3b8; display: flex; flex-direction: column; z-index: 1000; }
        .nav-link { color: #cbd5e1; padding: 0.75rem 1.5rem; display: flex; align-items: center; font-weight: 500; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: rgba(255,255,255,0.05); }
        .nav-link.active { background-color: rgba(16, 185, 129, 0.1); border-left: 3px solid #10b981; } /* VERDE para Pasajeros */
        .main-content { margin-left: var(--sidebar-width); padding-top: var(--header-height); min-height: 100vh; }
        .top-header { height: var(--header-height); background: white; border-bottom: 1px solid #e2e8f0; position: fixed; top: 0; right: 0; left: var(--sidebar-width); z-index: 900; display: flex; align-items: center; padding: 0 2rem; justify-content: space-between; }
        .table-card { background: white; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; }
        .table thead th { background-color: #f8fafc; color: #64748b; font-weight: 600; font-size: 0.75rem; padding: 0.75rem 1.5rem; border-bottom: 1px solid #e2e8f0; }
        .table tbody td { padding: 1rem 1.5rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .btn-primary-corp { background-color: #0f172a; color: white; border:none; padding: 0.5rem 1.5rem; }
    </style>
</head>
<body>
<nav class="sidebar">
    <div class="px-4 py-3 text-white fw-bold border-bottom border-secondary"><i class="fas fa-plane-departure me-2"></i> KRAsky ERP</div>
    <div class="d-flex flex-column flex-grow-1 py-3">
        <a href="/" class="nav-link"><i class="fas fa-chart-pie me-2"></i> Dashboard</a>
        <a href="/web/vuelos" class="nav-link"><i class="fas fa-plane me-2"></i> Gestión Vuelos</a>
        <a href="/web/reservas" class="nav-link"><i class="fas fa-ticket-alt me-2"></i> Reservas</a>
        <a href="/web/pasajeros" class="nav-link active"><i class="fas fa-users me-2"></i> Base de Clientes</a>
        <a href="/web/aviones" class="nav-link"><i class="fas fa-plane-up me-2"></i> Flota Aérea</a>
    </div>
</nav>

<header class="top-header">
    <div class="d-flex align-items-center text-muted"><span class="fw-medium">Recursos / Pasajeros</span></div>
</header>

<main class="main-content">
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-dark">Base de Datos de Clientes</h4>
            <a href="/web/pasajeros/nuevo" class="btn btn-primary-corp"><i class="fas fa-user-plus me-2"></i>Registrar Cliente</a>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table mb-0 table-hover">
                    <thead>
                    <tr>
                        <th>Información Cliente</th>
                        <th>Identificación (DNI)</th>
                        <th>Contacto</th>
                        <th>Fecha Nacimiento</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${listaPasajeros}">
                        <td>
                            <div class="fw-bold text-dark" th:text="${p.nombre} + ' ' + ${p.apellidos}"></div>
                            <small class="text-muted">VIP Customer</small>
                        </td>
                        <td class="text-secondary fw-medium" th:text="${p.dni}"></td>
                        <td>
                            <div th:text="${p.email}"></div>
                            <small class="text-muted" th:text="${p.telefono}"></small>
                        </td>
                        <td th:text="${p.fechaNacimiento}"></td>
                        <td class="text-end">
                            <a th:href="@{/web/pasajeros/editar/{id}(id=${p.id})}" class="btn btn-sm btn-link text-secondary"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/web/pasajeros/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-link text-danger" onclick="return confirm('¿Eliminar?');"><i class="fas fa-trash-alt"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>

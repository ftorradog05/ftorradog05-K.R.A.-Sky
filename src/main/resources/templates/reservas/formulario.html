<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>KRAsky | Editor Reserva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    .main-content { padding: 2rem; display: flex; justify-content: center; min-height: 100vh; }
    .card-form { background: white; border: 1px solid #e2e8f0; border-radius: 8px; width: 100%; max-width: 800px; }
    .btn-primary-corp { background-color: #0f172a; color: white; border: none; padding: 0.6rem 2rem; }
  </style>
</head>
<body>
<div class="main-content">
  <div class="card card-form">
    <div class="card-header bg-white border-bottom p-4">
      <h5 class="mb-0 fw-bold">Emisión de Billete</h5>
    </div>
    <div class="card-body p-4">
      <form th:action="@{/web/reservas/guardar}" th:object="${reserva}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold small">Código Reserva</label>
            <input type="text" class="form-control" th:field="*{codigoReserva}" required placeholder="SKY-..." />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">Fecha</label>
            <input type="datetime-local" class="form-control" th:field="*{fechaReserva}" required />
          </div>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold small">Vuelo</label>
            <select class="form-select" th:field="*{vueloId}" required>
              <option value="">Seleccione Vuelo...</option>
              <option th:each="v : ${listaVuelos}" th:value="${v.id}" th:text="${v.numeroVuelo} + ' (' + ${v.origen} + '-' + ${v.destino} + ')'"></option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold small">Pasajero</label>
            <select class="form-select" th:field="*{pasajeroId}" required>
              <option value="">Seleccione Pasajero...</option>
              <option th:each="p : ${listaPasajeros}" th:value="${p.id}" th:text="${p.nombre} + ' ' + ${p.apellidos}"></option>
            </select>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-md-3">
            <label class="form-label fw-bold small">Clase</label>
            <select class="form-select" th:field="*{clase}">
              <option value="TURISTA">TURISTA</option>
              <option value="BUSINESS">BUSINESS</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Precio</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precioTotal}" required />
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Estado</label>
            <select class="form-select" th:field="*{estado}">
              <option value="CONFIRMADA">CONFIRMADA</option>
              <option value="PENDIENTE_PAGO">PENDIENTE</option>
              <option value="CANCELADA">CANCELADA</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold small">Asiento</label>
            <input type="text" class="form-control" th:field="*{asiento}" placeholder="12A" />
          </div>
        </div>

        <div class="d-flex justify-content-between mt-5 pt-3 border-top">
          <a href="/web/reservas" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary-corp">Confirmar Reserva</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>

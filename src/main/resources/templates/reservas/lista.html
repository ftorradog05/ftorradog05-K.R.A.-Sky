<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KRAsky - Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-ticket-alt me-2"></i>Reservas KRAsky</h2>
        <div>
            <a href="/" class="btn btn-secondary me-2">Volver</a>
            <a href="/web/reservas/nuevo" class="btn btn-warning"><i class="fas fa-plus"></i> Nueva Reserva</a>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Código</th>
                    <th>Fecha</th>
                    <th>Clase</th>
                    <th>Precio</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${listaReservas}">
                    <td th:text="${r.codigoReserva}" class="fw-bold"></td>
                    <td th:text="${#temporals.format(r.fechaReserva, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${r.clase}"></td>
                    <td th:text="${r.precioTotal} + ' €'"></td>
                    <td>
                            <span th:text="${r.estado}"
                                  th:class="${r.estado == 'CONFIRMADA'} ? 'badge bg-success' : 'badge bg-danger'"></span>
                    </td>
                    <td>
                        <a th:href="@{/web/reservas/editar/{id}(id=${r.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                        <a th:href="@{/web/reservas/eliminar/{id}(id=${r.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Cancelar reserva?');"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

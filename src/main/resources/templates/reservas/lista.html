<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>KRAsky | Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-bg: #1e293b; --sidebar-width: 260px; --header-height: 60px; }
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; font-size: 0.875rem; }

        /* SIDEBAR EXACTA */
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background-color: var(--sidebar-bg); color: #94a3b8; border-right: 1px solid rgba(255,255,255,0.05); z-index: 1000; display: flex; flex-direction: column; }
        .sidebar-brand { height: var(--header-height); display: flex; align-items: center; padding: 0 1.5rem; color: white; font-weight: 700; font-size: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.1); background-color: rgba(0,0,0,0.1); }

        .nav-link { color: #cbd5e1; padding: 0.75rem 1.5rem; display: flex; align-items: center; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; text-decoration: none; }
        .nav-link:hover { color: white; background-color: rgba(255,255,255,0.05); }
        .nav-link.active { color: white; background-color: rgba(59, 130, 246, 0.1); border-left-color: #3b82f6; }
        /* ESTO ARREGLA LOS ICONOS: */
        .nav-link i { width: 24px; margin-right: 10px; text-align: center; font-size: 1rem; }

        .sidebar-heading { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; padding: 1.5rem 1.5rem 0.5rem; font-weight: 700; }

        /* CONTENIDO */
        .main-content { margin-left: var(--sidebar-width); padding-top: var(--header-height); min-height: 100vh; }
        .top-header { height: var(--header-height); background: white; border-bottom: 1px solid #e2e8f0; position: fixed; top: 0; right: 0; left: var(--sidebar-width); z-index: 900; display: flex; align-items: center; padding: 0 2rem; justify-content: space-between; }
        .table-card { background: white; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; }
        .table thead th { background-color: #f8fafc; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 1.5rem; }
        .table tbody td { padding: 1rem 1.5rem; color: #334155; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .btn-primary-corp { background-color: #0f172a; border-color: #0f172a; color: white; }
    </style>
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-plane-departure me-2"></i> KRAsky ERP
    </div>

    <div class="d-flex flex-column flex-grow-1 py-3">
        <div class="sidebar-heading">Principal</div>
        <a href="/" class="nav-link">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>

        <div class="sidebar-heading">Operaciones</div>
        <a href="/web/vuelos" class="nav-link">
            <i class="fas fa-plane"></i> Gestión Vuelos
        </a>
        <a href="/web/reservas" class="nav-link active">
            <i class="fas fa-ticket-alt"></i> Reservas y Billetes
        </a>

        <div class="sidebar-heading">Recursos</div>
        <a href="/web/pasajeros" class="nav-link">
            <i class="fas fa-users"></i> Base de Clientes
        </a>
        <a href="/web/aviones" class="nav-link">
            <i class="fas fa-plane-up"></i> Flota Aérea
        </a>
    </div>

    <div class="p-3 border-top border-secondary border-opacity-25">
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center text-white me-2" style="width: 32px; height: 32px;">
                    <i class="fas fa-user small"></i>
                </div>
                <div>
                    <div class="small text-white fw-bold" sec:authentication="name">Usuario</div>
                    <div class="small text-muted" style="font-size: 0.7rem;">Sesión Activa</div>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<header class="top-header">
    <div class="d-flex align-items-center text-muted"><span class="fw-medium">Operaciones / Billetes</span></div>
</header>

<main class="main-content">
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold text-dark mb-1">Gestión de Reservas</h4>
                <p class="text-muted mb-0">Emisión y control de billetes.</p>
            </div>
            <a href="/web/reservas/nuevo" class="btn btn-primary-corp"><i class="fas fa-plus me-2"></i>Emitir Billete</a>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table mb-0 table-hover">
                    <thead>
                    <tr>
                        <th>Código Reserva</th>
                        <th>Fecha Emisión</th>
                        <th>Clase</th>
                        <th>Importe</th>
                        <th>Estado Pago</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${listaReservas}">
                        <td class="fw-bold text-primary" th:text="${r.codigoReserva}"></td>
                        <td th:text="${#temporals.format(r.fechaReserva, 'dd MMM yyyy')}"></td>
                        <td><span class="badge bg-light text-dark border" th:text="${r.clase}"></span></td>
                        <td class="fw-bold" th:text="${r.precioTotal} + ' €'"></td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="${r.estado == 'CONFIRMADA'} ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'"
                                  th:text="${r.estado}">
                            </span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/web/reservas/editar/{id}(id=${r.id})}" class="btn btn-sm btn-link text-secondary"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/web/reservas/eliminar/{id}(id=${r.id})}" class="btn btn-sm btn-link text-danger" onclick="return confirm('¿Cancelar?');"><i class="fas fa-ban"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

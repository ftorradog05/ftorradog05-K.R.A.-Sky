<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KRAsky | Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-bg: #1e293b; --sidebar-width: 260px; --header-height: 60px; }
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; font-size: 0.875rem; }
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background-color: var(--sidebar-bg); color: #94a3b8; display: flex; flex-direction: column; z-index: 1000; }
        .nav-link { color: #cbd5e1; padding: 0.75rem 1.5rem; display: flex; align-items: center; font-weight: 500; text-decoration: none; }
        .nav-link.active { background-color: rgba(245, 158, 11, 0.1); border-left: 3px solid #f59e0b; } /* NARANJA para Reservas */
        .main-content { margin-left: var(--sidebar-width); padding-top: var(--header-height); min-height: 100vh; }
        .top-header { height: var(--header-height); background: white; border-bottom: 1px solid #e2e8f0; position: fixed; top: 0; right: 0; left: var(--sidebar-width); z-index: 900; display: flex; align-items: center; padding: 0 2rem; justify-content: space-between; }
        .table-card { background: white; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; }
        .table thead th { background-color: #f8fafc; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 1.5rem; }
        .table tbody td { padding: 1rem 1.5rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .btn-primary-corp { background-color: #0f172a; color: white; border: none; padding: 0.5rem 1.5rem; }
    </style>
</head>
<body>
<nav class="sidebar">
    <div class="px-4 py-3 text-white fw-bold border-bottom border-secondary"><i class="fas fa-plane-departure me-2"></i> KRAsky ERP</div>
    <div class="d-flex flex-column flex-grow-1 py-3">
        <a href="/" class="nav-link"><i class="fas fa-chart-pie me-2"></i> Dashboard</a>
        <a href="/web/vuelos" class="nav-link"><i class="fas fa-plane me-2"></i> Gestión Vuelos</a>
        <a href="/web/reservas" class="nav-link active"><i class="fas fa-ticket-alt me-2"></i> Reservas y Billetes</a>
        <a href="/web/pasajeros" class="nav-link"><i class="fas fa-users me-2"></i> Base de Clientes</a>
        <a href="/web/aviones" class="nav-link"><i class="fas fa-plane-up me-2"></i> Flota Aérea</a>
    </div>
</nav>

<header class="top-header">
    <div class="d-flex align-items-center text-muted"><span class="fw-medium">Operaciones / Billetes</span></div>
</header>

<main class="main-content">
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-dark">Gestión de Reservas</h4>
            <a href="/web/reservas/nuevo" class="btn btn-primary-corp"><i class="fas fa-plus me-2"></i>Emitir Billete</a>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table mb-0 table-hover">
                    <thead>
                    <tr>
                        <th>Código Reserva</th>
                        <th>Fecha Emisión</th>
                        <th>Clase</th>
                        <th>Importe</th>
                        <th>Estado Pago</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${listaReservas}">
                        <td class="fw-bold text-primary" th:text="${r.codigoReserva}"></td>
                        <td th:text="${#temporals.format(r.fechaReserva, 'dd MMM yyyy')}"></td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${r.clase}"></span>
                        </td>
                        <td class="fw-bold" th:text="${r.precioTotal} + ' €'"></td>
                        <td>
                                    <span class="status-badge"
                                          th:classappend="${r.estado == 'CONFIRMADA'} ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'"
                                          th:text="${r.estado}">
                                    </span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/web/reservas/editar/{id}(id=${r.id})}" class="btn btn-sm btn-link text-secondary"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/web/reservas/eliminar/{id}(id=${r.id})}" class="btn btn-sm btn-link text-danger" onclick="return confirm('¿Cancelar reserva?');"><i class="fas fa-ban"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>

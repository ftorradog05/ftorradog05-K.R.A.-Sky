<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro - KRA-Sky</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow-sm border-0" style="max-width: 450px; width: 100%;">
    <div class="card-body p-4">

        <div class="text-center mb-4">
            <div class="mb-2">
                <i class="fa-solid fa-plane-departure text-primary" style="font-size: 3rem;"></i>
            </div>
            <h3 class="fw-bold text-dark">Nuevo Pasajero</h3>
            <p class="text-muted small">Únete a KRA-Sky para volar</p>
        </div>

        <form th:action="@{/registro}" th:object="${usuario}" method="post">

            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">NOMBRE DE USUARIO</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-primary"><i class="fa-solid fa-user"></i></span>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="Ej: viajero1" required />
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">EMAIL</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-primary"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="correo@ejemplo.com" required />
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">CONTRASEÑA</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-primary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••" required />
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">NOMBRE REAL</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-primary"><i class="fa-solid fa-id-card"></i></span>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Tu nombre completo" required />
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                <i class="fa-solid fa-check me-1"></i> CREAR CUENTA
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/login" class="text-decoration-none small text-muted">
                <i class="fa-solid fa-arrow-left"></i> Volver al Login
            </a>
        </div>

    </div>
</div>

</body>
</html>

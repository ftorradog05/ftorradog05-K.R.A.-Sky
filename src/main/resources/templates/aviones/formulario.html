<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KRAsky - Avión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow col-md-6 mx-auto">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">Datos del Avión</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/web/aviones/guardar}" th:object="${avion}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="mb-3">
                    <label>Matrícula</label>
                    <input type="text" class="form-control" th:field="*{matricula}" required />
                </div>
                <div class="mb-3">
                    <label>Modelo</label>
                    <input type="text" class="form-control" th:field="*{modelo}" required />
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label>Cap. Turista</label>
                        <input type="number" class="form-control" th:field="*{capacidadTurista}" required />
                    </div>
                    <div class="col-6 mb-3">
                        <label>Cap. Business</label>
                        <input type="number" class="form-control" th:field="*{capacidadBusiness}" required />
                    </div>
                </div>
                <button type="submit" class="btn btn-info text-white w-100">Guardar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>

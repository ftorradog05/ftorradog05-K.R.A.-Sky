<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Iniciar Sesión - KRA-Sky</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow-sm border-0" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">

        <div class="text-center mb-4">
            <div class="mb-2">
                <i class="fa-solid fa-plane-departure text-primary" style="font-size: 3rem;"></i>
            </div>
            <h3 class="fw-bold text-dark">KRA-Sky</h3>
            <p class="text-muted small">Panel de Gestión de Vuelos</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger text-center py-2" role="alert">
            <small><i class="fa-solid fa-circle-exclamation"></i> Credenciales incorrectas</small>
        </div>
        <div th:if="${param.logout}" class="alert alert-success text-center py-2" role="alert">
            <small><i class="fa-solid fa-check"></i> Sesión cerrada</small>
        </div>
        <div th:if="${param.registrado}" class="alert alert-info text-center py-2" role="alert">
            <small><i class="fa-solid fa-user-check"></i> Cuenta creada con éxito</small>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold"><i class="fa-solid fa-user"></i> USUARIO</label>
                <input type="text" name="username" class="form-control" placeholder="Ej: admin" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold"><i class="fa-solid fa-lock"></i> CONTRASEÑA</label>
                <input type="password" name="password" class="form-control" placeholder="••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                ENTRAR <i class="fa-solid fa-right-to-bracket ms-1"></i>
            </button>
        </form>

        <hr class="my-4 text-secondary opacity-25">

        <div class="text-center">
            <p class="mb-2 text-muted small">¿No tienes cuenta?</p>
            <a href="/registro" class="btn btn-outline-primary w-100 fw-bold">
                <i class="fa-solid fa-user-plus me-1"></i> REGISTRARSE
            </a>
        </div>

    </div>
</div>

</body>
</html>

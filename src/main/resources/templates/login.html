<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KRAsky | Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-login { width: 100%; max-width: 400px; border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primary-corp { background-color: #0f172a; color: white; border: none; }
        .btn-primary-corp:hover { background-color: #1e293b; color: white; }
    </style>
</head>
<body>

<div class="card card-login p-4">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark"><i class="fas fa-plane-departure me-2"></i>KRAsky ERP</h3>
        <p class="text-muted">Acceso al Sistema</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
        Usuario o contraseña incorrectos
    </div>

    <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
        Has cerrado sesión correctamente
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary-corp btn-lg">Entrar</button>
        </div>
    </form>
</div>

</body>
</html>

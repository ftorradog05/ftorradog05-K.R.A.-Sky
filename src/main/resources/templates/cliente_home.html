<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Reserva tu vuelo | KRA-Sky</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.4);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .search-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-top: 5vh;
        }
        .btn-search {
            background-color: #0f172a;
            color: white;
            padding: 0.8rem;
            font-weight: 600;
        }
        .btn-search:hover { background-color: #1e293b; color: white; }

        .flight-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            transition: transform 0.2s;
            border: none;
        }
        .flight-card:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="overlay">

    <nav class="navbar navbar-expand-lg navbar-glass px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold text-primary" href="#">
                <i class="fa-solid fa-plane-departure me-2 fs-3"></i> KRA-Sky
            </a>

            <div class="dropdown ms-auto">
                <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle" id="userMenu" data-bs-toggle="dropdown">
                    <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-2" style="width: 40px; height: 40px;">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="d-none d-md-block">
                        <span class="d-block fw-bold" sec:authentication="name">Viajero</span>
                        <small class="text-muted">Cliente</small>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                    <li><h6 class="dropdown-header">Mi Cuenta</h6></li>
                    <li><a class="dropdown-item" href="#"><i class="fa-solid fa-ticket me-2"></i> Mis Reservas</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="dropdown-item text-danger fw-bold">
                                <i class="fa-solid fa-right-from-bracket me-2"></i> Cerrar Sesión
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="text-center text-white mb-4 mt-5">
                    <h1 class="fw-bold display-5">¿A dónde quieres volar hoy?</h1>
                </div>

                <div class="search-card mb-5">
                    <form th:action="@{/}" method="get">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-muted small">ORIGEN</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-plane-departure text-secondary"></i></span>
                                    <input type="text" name="origen" class="form-control border-start-0 bg-light"
                                           placeholder="Ej: Madrid" th:value="${param.origen}">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-muted small">DESTINO</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-plane-arrival text-secondary"></i></span>
                                    <input type="text" name="destino" class="form-control border-start-0 bg-light"
                                           placeholder="Ej: Roma" th:value="${param.destino}">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-muted small">FECHA</label>
                                <input type="date" class="form-control bg-light">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-muted small">&nbsp;</label>
                                <button type="submit" class="btn btn-search w-100 shadow-sm">
                                    <i class="fa-solid fa-magnifying-glass me-2"></i> BUSCAR
                                </button>
                                <div class="text-center mt-2" th:if="${param.origen != null or param.destino != null}">
                                    <a href="/" class="text-muted small text-decoration-none fw-bold text-dark"><i class="fa-solid fa-xmark"></i> Limpiar filtros</a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <h3 class="text-white fw-bold mb-3">
                    <i class="fa-solid fa-bullhorn me-2"></i>
                    <span th:text="${#lists.isEmpty(listaVuelos) ? 'Resultados' : 'Vuelos Disponibles'}">Próximas Salidas</span>
                </h3>

                <div class="row g-3">
                    <div class="col-md-6 col-xl-4" th:each="v : ${listaVuelos}">
                        <div class="card flight-card h-100 p-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-primary rounded-pill" th:text="${v.numeroVuelo}">IB1234</span>
                                <span class="text-muted small fw-bold" th:text="${#temporals.format(v.fechaSalida, 'dd MMM - HH:mm')}">12 Oct - 14:00</span>
                            </div>

                            <div class="d-flex align-items-center justify-content-between my-3 text-center">
                                <div>
                                    <div class="h4 fw-bold mb-0" th:text="${v.origen}">MAD</div>
                                    <small class="text-muted">Origen</small>
                                </div>
                                <div class="text-muted px-2">
                                    <i class="fa-solid fa-plane text-primary"></i>
                                    <hr class="my-1" style="width: 50px; border-top: 2px dashed #ccc;">
                                </div>
                                <div>
                                    <div class="h4 fw-bold mb-0" th:text="${v.destino}">NYC</div>
                                    <small class="text-muted">Destino</small>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
                                <div>
                                    <span class="small text-muted">Desde</span>
                                    <div class="h5 fw-bold text-dark mb-0" th:text="${v.precioTurista} + ' €'">150 €</div>
                                </div>
                                <button class="btn btn-sm btn-outline-primary fw-bold">Reservar</button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 text-center mt-4" th:if="${#lists.isEmpty(listaVuelos)}">
                        <div class="alert alert-warning d-inline-block shadow border-0 px-5 py-3">
                            <h5 class="mb-0"><i class="fa-solid fa-circle-exclamation me-2"></i> No se encontraron vuelos</h5>
                            <small>Prueba a cambiar los términos de búsqueda o <a href="/" class="alert-link">ver todos</a>.</small>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
